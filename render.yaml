# Render blueprint. Create the service from this rather than clicking through
# the dashboard, so the configuration is in the repository and reviewable.
#
#   Render → New → Blueprint → pick this repo
#
# The database is NOT here on purpose: it is on Neon, which has a free tier
# that does not expire and a pooled endpoint that suits an instance allowed to
# sleep.

services:
  - type: web
    name: purchase-tracker-api
    runtime: docker

    # Pinned, because the GitHub mirror's DEFAULT branch is `main` and `main`
    # holds nothing but the README that creating the repository generated. The
    # code is on `master`. Without this, Render builds the default branch and
    # finds no Dockerfile.
    #
    # Vercel needs the same thing said in its dashboard (Settings -> Git ->
    # Production Branch = master), since there is no equivalent file for it.
    branch: master
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health

    # NO preDeployCommand: it is a paid-plan feature, so on `free` the schema
    # would never be applied. Migrations run from the container's start command
    # instead — see apps/api/Dockerfile. Move them back here on a paid plan,
    # where they belong: a pre-deploy step that fails stops the release, while
    # a start command that fails takes the service down.
    #
    # NO disk either — free instances cannot attach one. That makes receipt
    # storage ephemeral, which is a KNOWN LIMITATION against BR-10, recorded in
    # CHANGELOG.md. Uploads survive until the instance redeploys, restarts, or
    # idles 15 minutes and spins down. A persistent disk on a paid plan is the
    # fix; object storage behind the STORAGE token is the other.

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: BCRYPT_ROUNDS
        value: 12
      - key: JWT_EXPIRES_IN
        value: 7d

      # Managed Postgres refuses an unencrypted connection.
      - key: DATABASE_SSL
        value: true

      # Generated once by Render and never seen by anyone. Reusing the
      # development secret would make every cookie ever issued on a laptop
      # valid in production.
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      # Set by hand in the dashboard — they are secrets, or they are not known
      # until the other services exist.
      - key: DATABASE_URL        # Neon, the POOLED connection string
        sync: false
      - key: WEB_ORIGIN          # the Vercel domain; this is the CORS allow-list
        sync: false
      - key: APP_URL             # the Vercel domain; reset links are built from it
        sync: false
      # Brevo over HTTPS, not SMTP. A free instance blocks outbound 25, 465
      # and 587 (render.com/changelog/free-web-services-will-no-longer-allow-
      # outbound-traffic-to-smtp-ports), so SmtpMailer cannot get a packet out
      # -- and cannot report that it failed, because sending is best-effort.
      # On a paid plan, `smtp` and the SMTP_* values below work as they are.
      - key: MAIL_DRIVER
        value: brevo-api
      - key: BREVO_API_KEY     # Brevo's REST key (xkeysib-), NOT the SMTP key
        sync: false

      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: c11764001@smtp-brevo.com
      - key: SMTP_PASS           # the Brevo SMTP key
        sync: false
      - key: MAIL_FROM
        sync: false

      # Five attempts a minute at /auth/*. Generous for a person, useless for
      # a script (security.md §8).
      - key: THROTTLE_AUTH_LIMIT
        value: 5
      - key: THROTTLE_AUTH_TTL
        value: 60
