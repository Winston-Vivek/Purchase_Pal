<title>Proofly Wireframes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: review toolbar on top, one device frame below, review notes beside it (stacked on narrow screens).
   Low-fidelity contract: grayscale, system type, borders only. Visual design lives in ui-guide.md. */
:root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --ink: #1c2028;
  --ink-2: #545b67;
  --line: #8b929d;
  --line-2: #dfe2e7;
  --fill: #eceef1;
  --fill-2: #d6dae0;
  --strong: #1c2028;
  --on-strong: #ffffff;
  --scrim: rgba(28, 32, 40, 0.45);
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1c1f25; --ink: #e8eaee; --ink-2: #a5abb5; --line: #6c7380; --line-2: #2f333b;
    --fill: #252930; --fill-2: #353a43; --strong: #e8eaee; --on-strong: #14161a; --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1c1f25; --ink: #e8eaee; --ink-2: #a5abb5; --line: #6c7380; --line-2: #2f333b;
  --fill: #252930; --fill-2: #353a43; --strong: #e8eaee; --on-strong: #14161a; --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Review toolbar ---------- */
.review { max-width: 1240px; margin: 0 auto 16px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.review-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.review-head h1 { font-size: 20px; }
.review-head p { color: var(--ink-2); font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
.ctl { display: grid; gap: 4px; min-width: 0; }
.ctl-label { font: 600 11px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-right: 1px solid var(--line-2); background: transparent; padding: 7px 12px; cursor: pointer; font-size: 14px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--strong); color: var(--on-strong); font-weight: 600; }
.ctl select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-height: 36px; }
.screens { flex: 1 1 100%; max-width: 100%; overflow-x: auto; }
.screens .seg { flex-wrap: nowrap; width: max-content; }

/* ---------- Stage ---------- */
.stage { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .notes { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } .notes > h2 { grid-column: 1 / -1; } }
.frame-wrap { min-width: 0; }
.frame {
  container: app / inline-size; position: relative; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0 auto; width: 100%;
}
.frame.is-mobile { width: 360px; max-width: 100%; border-radius: 20px; }
.frame-cap { font: 12px/1.4 var(--f-mono); color: var(--ink-2); text-align: center; margin-top: 8px; }
.notes { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 16px; display: grid; gap: 12px; font-size: 14px; }
.notes h2 { font-size: 15px; }
.notes .dir { border-left: 3px solid var(--strong); padding-left: 10px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

/* ---------- App shell (inside the frame) ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 640px; }
.side { display: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.logo { font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 5px; display: grid; place-items: center; font-size: 12px; }
.content { padding: 16px; display: grid; gap: 24px; align-content: start; min-width: 0; }
.bottom { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line-2); background: var(--panel); }
.bottom a { display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; text-decoration: none; font-size: 12px; color: var(--ink-2); min-height: 56px; }
.bottom a[aria-current="page"] { color: var(--ink); font-weight: 700; }
.bottom a[aria-current="page"] .ico { background: var(--fill-2); }
.bottom .ico { width: 36px; height: 24px; border-radius: 12px; display: grid; place-items: center; }
.bottom a.add .ico { background: var(--strong); color: var(--on-strong); }
@container app (min-width: 1024px) {
  .app { grid-template-columns: 220px minmax(0, 1fr); min-height: 720px; }
  .side { display: flex; flex-direction: column; gap: 16px; padding: 20px 14px; border-right: 1px solid var(--line-2); }
  .side nav { display: grid; gap: 2px; }
  .side nav a { text-decoration: none; padding: 9px 10px 9px 12px; border-radius: 6px; border-left: 3px solid transparent; color: var(--ink-2); }
  .side nav a[aria-current="page"] { border-left-color: var(--strong); background: var(--fill); color: var(--ink); font-weight: 600; }
  .side-foot { margin-top: auto; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
  .topbar, .bottom { display: none; }
  .content { padding: 28px 32px; gap: 32px; }
}

/* ---------- Primitives ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.ph h2 { font-size: 22px; }
.ph p { color: var(--ink-2); font-size: 14px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sec-h h3 { font-size: 16px; }
.sec-h a { font-size: 14px; }
.box { border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); }
.pad { padding: 16px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn.primary { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
.btn.danger { background: var(--panel); border: 2px solid var(--strong); }
.btn.ghost { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.only-wide { display: none; }
@container app (min-width: 1024px) { .only-wide { display: inline-flex; } .only-narrow { display: none !important; } }

/* Badges: wireframe stand-ins. Meaning is in the words; shape differs per status. */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; line-height: 1.5; max-width: 100%; }
.badge svg { flex: none; }
.b-ok { border: 1px solid var(--line); }
.b-warn { background: var(--fill-2); border: 1px solid var(--fill-2); }
.b-bad { background: var(--strong); color: var(--on-strong); border: 1px solid var(--strong); }
.b-none { border: 1px dashed var(--line); color: var(--ink-2); font-weight: 500; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@container app (min-width: 768px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; text-decoration: none; }
.stat b { font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-2); }
.stat.hot { border: 2px solid var(--strong); }

/* Rows */
.rows { display: grid; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line-2); text-decoration: none; cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--fill); }
.row .t { font-weight: 600; min-width: 0; }
.row .m { grid-column: 1; font-size: 13px; color: var(--ink-2); }
.row .badges { grid-column: 2; grid-row: 1 / span 2; justify-content: flex-end; }
@container app (max-width: 520px) { .row { grid-template-columns: minmax(0, 1fr); } .row .badges { grid-column: 1; grid-row: auto; justify-content: flex-start; } }
.two { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@container app (min-width: 1024px) { .two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Timeline (dashboard B) */
.tl-layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@container app (min-width: 1024px) { .tl-layout { grid-template-columns: minmax(0, 1fr) 220px; } }
.rail { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
@container app (min-width: 1024px) { .rail { flex-direction: column; overflow: visible; } }
.rail .stat { min-width: 140px; }
.tl { display: grid; gap: 20px; }
.tl-group { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 0 12px; }
.tl-dot { width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; margin-top: 4px; background: var(--panel); }
.tl-group.now .tl-dot { background: var(--strong); }
.tl-line { grid-column: 1; width: 2px; background: var(--line-2); justify-self: center; }
.tl-body { display: grid; gap: 8px; grid-row: span 2; }
.tl-body h3 { font-size: 15px; }

/* Table / cards */
.toolbar { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@container app (min-width: 768px) { .toolbar { grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); align-items: end; } }
.field { display: grid; gap: 6px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.num-row { display: flex; gap: 8px; align-items: center; }
.field .num-row input { width: 120px; flex: none; }
.field label, .field .lbl { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--ink-2); }
.field input, .field select, .field textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
}
.field textarea { min-height: 80px; resize: vertical; }
.field .err { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: flex-start; }
.field [aria-invalid="true"] { border: 2px solid var(--strong); }
.filters-mini { display: flex; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 3px 6px 3px 12px; font-size: 13px; background: var(--panel); }
.chip button { border: 0; background: var(--fill); border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }
.tbl-wrap { display: none; overflow-x: auto; border: 1px solid var(--line-2); border-radius: 8px; }
.cards { display: grid; gap: 10px; }
@container app (min-width: 768px) { .tbl-wrap { display: block; } .cards { display: none; } }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); background: var(--fill); padding: 10px 12px; white-space: nowrap; }
td { padding: 12px; border-top: 1px solid var(--line-2); vertical-align: top; }
td a { font-weight: 600; }
tr:hover td { background: var(--fill); }
.card { border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; text-decoration: none; }
.card .top { display: flex; justify-content: space-between; gap: 8px; }
.card .top b { min-width: 0; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }

/* Skeleton */
.sk { background: var(--fill); border-radius: 6px; height: 14px; }
.sk.h { height: 56px; }

/* Empty / message blocks */
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty h3 { font-size: 16px; }
.banner { border: 2px solid var(--strong); border-radius: 8px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.banner p { min-width: 0; flex: 1 1 220px; }

/* Details */
.dhead { display: grid; gap: 12px; }
.crumb { font-size: 13px; color: var(--ink-2); }
.dhead-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dhead-top h2 { font-size: 22px; min-width: 0; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
@container app (min-width: 768px) { .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.facts dt { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; }
.facts dd { margin: 0; font-weight: 600; }
.panels { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@container app (min-width: 768px) { .panels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.panel { border: 1px solid var(--line-2); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
.panel h3 { font-size: 15px; }
.panel .big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.panel.urgent { border: 2px solid var(--strong); }
.jump { display: flex; gap: 8px; overflow-x: auto; position: sticky; top: 0; background: var(--panel); padding: 8px 0; z-index: 1; border-bottom: 1px solid var(--line-2); }
.jump a { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; text-decoration: none; }
.files { display: grid; border: 1px solid var(--line-2); border-radius: 8px; }
.file { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line-2); }
.file:first-child { border-top: 0; }
.file .fi { width: 36px; height: 44px; border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center; font: 600 10px var(--f-mono); }
.file .fn { font-weight: 600; overflow-wrap: anywhere; }
.file .acts { display: flex; gap: 4px; }
@container app (max-width: 520px) { .file { grid-template-columns: 36px minmax(0, 1fr); } .file .acts { grid-column: 2; margin-left: -12px; } }
.svc { display: grid; gap: 0; border-left: 2px solid var(--line-2); margin-left: 6px; }
.svc-item { position: relative; padding: 0 0 16px 18px; display: grid; gap: 2px; }
.svc-item::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: var(--panel); }
.svc-item .when { font-size: 13px; color: var(--ink-2); }
.tabs { display: flex; border-bottom: 1px solid var(--line-2); gap: 4px; }
.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 600; color: var(--ink-2); min-height: 44px; }
.tabs button[aria-selected="true"] { border-bottom-color: var(--strong); color: var(--ink); }
.danger-zone { border: 1px dashed var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.danger-zone p { flex: 1 1 220px; min-width: 0; }

/* Forms */
.form { display: grid; gap: 24px; max-width: 640px; width: 100%; }
fieldset { border: 1px solid var(--line-2); border-radius: 8px; padding: 14px 16px 16px; margin: 0; display: grid; gap: 14px; min-width: 0; }
legend { font-weight: 700; padding: 0 6px; }
.grid2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@container app (min-width: 560px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.choice { display: grid; gap: 8px; }
.choice label { display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 6px; cursor: pointer; font-weight: 500; }
.choice input { width: 18px; height: 18px; }
.preview { background: var(--fill); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
.drop { border: 2px dashed var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.errsum { border: 2px solid var(--strong); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; }
.errsum h3 { font-size: 15px; }
.errsum ul { margin: 0; padding-left: 18px; }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.sticky-actions { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line-2); padding: 12px 0; }
.inline-num { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }

/* Overlay (dialogs) */
.overlay { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 5; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 480px; max-height: 100%; overflow: auto; padding: 18px; display: grid; gap: 16px; }
.dialog h2 { font-size: 18px; }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 72px; background: var(--strong); color: var(--on-strong); border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 14px; z-index: 6; white-space: nowrap; }
@container app (min-width: 1024px) { .toast { bottom: 24px; } }

/* Auth */
.auth { min-height: 640px; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 400px; display: grid; gap: 18px; }
.auth-card .box { padding: 20px; display: grid; gap: 14px; }
.demo { font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line-2); padding-top: 12px; }
.demo code { font-family: var(--f-mono); }
</style>

<section class="review" aria-label="Wireframe review controls">

</section>

<div class="stage">

</div>

    const err = (on, id, msg) => (on ? `<span class="err" id="${id}">${ic.alert}${msg}</span>` : '');
    const inv = on => (on ? ' aria-invalid="true"' : '');
    const cats = ['Electronics', 'Appliances', 'Mobile', 'Furniture', 'Fashion', 'Vehicle', 'Home & Kitchen', 'Other'];
    const retPrev = v.ret === 'none' ? 'No return window will be tracked.' : '<b>Return closes 3 Nov 2026</b> · in 7 days';
    const warPrev = edit ? '<b>Warranty ends 1 Nov 2026</b> · in 5 days' : (errs ? 'Add the warranty length to see the end date.' : '<b>Warranty ends 26 Oct 2027</b> · in 364 days');
    return shell('add-purchase', `${ph(edit ? 'Edit purchase' : 'Add purchase', edit ? '' : 'Only product, price and purchase date are required.')}
      <form class="form" id="pform" novalidate>
        ${errs ? `<div class="errsum" role="alert" tabindex="-1" id="errsum"><h3>Fix 2 problems to save</h3><ul><li><a href="#add-purchase" data-focus="f-name">Enter the product name</a></li><li><a href="#add-purchase" data-focus="f-wl">Enter how long the warranty lasts</a></li></ul></div>` : ''}
        <fieldset><legend>Product</legend>
          <div class="field"><label for="f-name">Product name</label><input id="f-name" value="${v.name}" placeholder="e.g. AirPods Pro (2nd generation)"${inv(errs)}${errs ? ' aria-describedby="e-name"' : ''}>${err(errs, 'e-name', 'Enter the product name')}</div>
          <div class="grid2">
            <div class="field"><label for="f-cat">Category</label><select id="f-cat">${cats.map(c => `<option${c === v.cat ? ' selected' : ''}>${c}</option>`).join('')}</select></div>
            <div class="field"><label for="f-seller">Seller <span class="muted">(optional)</span></label><input id="f-seller" value="${v.seller}"></div>
            <div class="field"><label for="f-price">Price</label><div class="inline-num"><input id="f-price" inputmode="decimal" value="${v.price}" aria-describedby="h-price"><select id="f-cur" aria-label="Currency"><option>INR ₹</option><option>USD $</option></select></div><span class="hint" id="h-price">Recorded as entered; not converted.</span></div>
            <div class="field"><label for="f-date">Purchase date</label><input id="f-date" type="date" value="${v.date}" max="2026-10-27"></div>
          </div>
          <div class="field"><label for="f-notes">Notes <span class="muted">(optional)</span></label><textarea id="f-notes" placeholder="Order number, serial number, where it's installed"></textarea></div>
        </fieldset>
        <fieldset><legend>Return</legend>
          <div class="choice" role="radiogroup" aria-label="Return rule">
            <label><input type="radio" name="ret" value="days"${v.ret === 'days' ? ' checked' : ''}>Return window in days</label>
            <label><input type="radio" name="ret" value="date">Exact last date</label>
            <label><input type="radio" name="ret" value="none"${v.ret === 'none' ? ' checked' : ''}>No return</label>
          </div>
          ${v.ret === 'days' ? '<div class="field"><label for="f-rw">Days to return</label><input id="f-rw" type="number" min="0" max="365" value="7" style="max-width:160px"></div>' : ''}
          <p class="preview" aria-live="polite">${retPrev}</p>
        </fieldset>
        <fieldset><legend>Warranty</legend>
          <label class="choice"><span style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="f-hasw"${v.w ? ' checked' : ''} style="width:18px;height:18px">Has a warranty</span></label>
          <div class="grid2">
            <div class="field"><label for="f-ws">Warranty starts</label><input id="f-ws" type="date" value="${v.ws}"><span class="hint">Defaults to the purchase date.</span></div>
            <div class="field"><label for="f-wl">Length</label><div class="inline-num"><input id="f-wl" type="number" min="1" max="120" value="${v.wl}"${inv(errs)}${errs ? ' aria-describedby="e-wl"' : ''}><select id="f-wu" aria-label="Unit"><option>months</option><option>years</option></select></div>${err(errs, 'e-wl', 'Enter how long the warranty lasts (1–120 months)')}</div>
          </div>
          <p class="preview" aria-live="polite">${warPrev}</p>
        </fieldset>
        ${edit ? '' : `<fieldset><legend>Receipt <span class="muted" style="font-weight:400">(optional)</span></legend>
          <div class="drop"><b>Drop the invoice here</b><span class="small muted">PDF, JPG, PNG or WEBP · up to 5 MB · 5 files max</span><label class="btn sm" for="f-file">Choose file</label><input id="f-file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" hidden></div>
        </fieldset>`}
        <div class="actions sticky-actions"><a class="btn" href="${edit ? '#details' : '#dashboard'}">Cancel</a><button class="btn primary" type="submit">${edit ? 'Save changes' : 'Save purchase'}</button></div>
      </form>`);
  }

  function serviceDialog() {
    const edit = st.state['service-dialog'] === 'Edit record';
    const dlg = `<div class="overlay"><form class="dialog" role="dialog" aria-modal="true" aria-labelledby="sd-t" id="sform" novalidate>
      <h2 id="sd-t">${edit ? 'Edit service record' : 'Add service record'}</h2>
      <p class="small muted">Samsung 1.5 Ton Inverter Split AC</p>
      <div class="field"><label for="s-date">Date</label><input id="s-date" type="date" value="${edit ? '2026-06-15' : '2026-10-27'}" max="2026-10-27"></div>
      <div class="field"><label for="s-desc">What was done</label><textarea id="s-desc" placeholder="e.g. Compressor replaced under warranty">${edit ? 'Gas top-up and coil cleaning' : ''}</textarea></div>
      <div class="grid2">
        <div class="field"><label for="s-prov">Service provider <span class="muted">(optional)</span></label><input id="s-prov" value="${edit ? 'Samsung authorised service' : ''}"></div>
        <div class="field"><label for="s-cost">Cost <span class="muted">(optional)</span></label><input id="s-cost" inputmode="decimal" value="${edit ? '2450' : ''}" placeholder="₹0.00"></div>
      </div>
      <div class="field"><label for="s-notes">Notes <span class="muted">(optional)</span></label><textarea id="s-notes">${edit ? 'Cooling was weak in the bedroom unit.' : ''}</textarea></div>
      <div class="actions"><a class="btn" href="#details">Cancel</a><button class="btn primary" type="submit">${edit ? 'Save changes' : 'Add record'}</button></div>
    </form></div>`;
    const saved = st.state.details;
    st.state.details = 'Default';
    const html = detailsBody(dlg);
    st.state.details = saved;
    return html;
  }

  function settings() {
    const saved = st.state['alert-settings'] === 'Saved';
    return shell('alert-settings', `${ph('Settings', '')}
      <form class="form" id="setform" novalidate>
        <fieldset><legend>When to warn me</legend>
          <div class="field"><label for="w-days">Before a warranty ends</label><div class="num-row"><input id="w-days" type="number" min="1" max="365" value="30" aria-describedby="w-h"><span>days</span></div><span class="hint" id="w-h">1–365 days. Default 30.</span></div>
          <div class="field"><label for="r-days">Before a return window closes</label><div class="num-row"><input id="r-days" type="number" min="1" max="60" value="7" aria-describedby="r-h"><span>days</span></div><span class="hint" id="r-h">1–60 days. Default 7.</span></div>
          <p class="preview">A warranty ending on 1 Nov 2026 shows <b>Ends in N days</b> from 2 Oct 2026. A return closing on 3 Nov 2026 shows <b>Closes in N days</b> from 27 Oct 2026.</p>
          <div class="actions"><button class="btn primary" type="submit">Save</button></div>
        </fieldset>
        <fieldset><legend>Account</legend>
          <dl class="facts" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><dt>Name</dt><dd>Winston</dd></div><div><dt>Email</dt><dd style="overflow-wrap:anywhere">demo@proofly.test</dd></div></dl>
          <div><a class="btn" href="#signin">Sign out</a></div>
        </fieldset>
      </form>`, saved ? '<div class="toast" role="status">Settings saved</div>' : '');
  }

  const RENDER = { signin, dashboard, purchases, details: () => detailsBody(), 'add-purchase': addPurchase, 'service-dialog': serviceDialog, 'alert-settings': settings };

  // ---------- Controls ----------
  const frame = document.getElementById('frame');
  const screenSeg = document.getElementById('screenSeg');
  const dirCtl = document.getElementById('dirCtl'), dirSeg = document.getElementById('dirSeg');
  const stateSel = document.getElementById('stateSel');
  const notes = document.getElementById('notes');
  const cap = document.getElementById('frameCap');

  screenSeg.innerHTML = SCREENS.map(s => `<button type="button" data-screen="${s.id}">${s.label}</button>`).join('');

  function render() {
    const def = SCREENS.find(s => s.id === st.screen);
    screenSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.screen === st.screen)));
    dirCtl.hidden = !def.dirs;
    if (def.dirs) dirSeg.innerHTML = def.dirs.map(x => `<button type="button" data-dir="${x.id}" aria-pressed="${st.dir[def.id] === x.id}">${x.name}</button>`).join('');
    stateSel.innerHTML = def.states.map(x => `<option${x === st.state[def.id] ? ' selected' : ''}>${x}</option>`).join('');
    frame.classList.toggle('is-mobile', st.vp === 'mobile');
    document.querySelectorAll('#vpSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vp === st.vp)));
    frame.innerHTML = RENDER[def.id]();
    cap.textContent = `${def.label} · ${def.dirs ? def.dirs.find(x => x.id === st.dir[def.id]).name + ' · ' : ''}${st.state[def.id]} · ${st.vp === 'mobile' ? '360 px' : 'desktop'}`;
    const dirNote = def.dirs ? def.dirs.map(x => `<div class="dir"><b>${x.name}</b><p class="small">${x.why}</p></div>`).join('') : '';
    notes.innerHTML = `<h2>Review: ${def.label}</h2>${dirNote}<ul>${NOTES[def.id].map(n => `<li>${n}</li>`).join('')}</ul><p class="small muted">Sample data uses today = 27 Oct 2026 and the default 30 / 7 day alert windows.</p>`;
    const es = document.getElementById('errsum');
    if (es && pendingFocusErr) { es.focus(); pendingFocusErr = false; }
    const dlg = frame.querySelector('.overlay .dialog');
    if (dlg) { const first = dlg.querySelector('input, textarea, button, a[href]'); if (first) first.focus(); }
  }
  let pendingFocusErr = false;

  function go(screen) {
    if (!RENDER[screen]) screen = 'dashboard';
    if (screen !== 'details' && st.state.details === 'Delete confirm') st.state.details = 'Default';
    st.screen = screen;
    render();
  }

  screenSeg.addEventListener('click', e => { const b = e.target.closest('button[data-screen]'); if (b) { location.hash = b.dataset.screen; } });
  dirSeg.addEventListener('click', e => { const b = e.target.closest('button[data-dir]'); if (b) { st.dir[st.screen] = b.dataset.dir; render(); } });
  stateSel.addEventListener('change', () => { st.state[st.screen] = stateSel.value; render(); });
  document.getElementById('vpSeg').addEventListener('click', e => { const b = e.target.closest('button[data-vp]'); if (b) { st.vp = b.dataset.vp; render(); } });

  frame.addEventListener('click', e => {
    const el = e.target.closest('[data-state],[data-tab],[data-jump],[data-focus]');
    if (!el) return;
    if (el.dataset.tab) { st.tab = el.dataset.tab; render(); frame.querySelector(`[data-tab="${st.tab}"]`).focus(); return; }
    if (el.dataset.jump) { e.preventDefault(); const t = document.getElementById(el.dataset.jump); if (t) t.scrollIntoView({ block: 'start' }); return; }
    if (el.dataset.focus) { e.preventDefault(); const t = document.getElementById(el.dataset.focus); if (t) t.focus(); return; }
    // data-state: set the state of the screen the link leads to (or this one)
    const target = (el.getAttribute('href') || '').replace('#', '') || st.screen;
    st.state[target] = el.dataset.state;
    if (target === st.screen) { e.preventDefault(); render(); }
  });
  frame.addEventListener('submit', e => {
    e.preventDefault();
    const id = e.target.id;
    if (id === 'authForm') location.hash = 'dashboard';
    else if (id === 'pform') {
      if (st.state['add-purchase'] === 'Validation errors') { pendingFocusErr = true; render(); }
      else location.hash = 'details';
    } else if (id === 'sform') location.hash = 'details';
    else if (id === 'setform') { st.state['alert-settings'] = 'Saved'; render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (st.screen === 'service-dialog' || st.state.details === 'Delete confirm')) {
      if (st.screen === 'service-dialog') location.hash = 'details';
      else { st.state.details = 'Default'; render(); }
    }
  });

  window.addEventListener('hashchange', () => go(location.hash.slice(1)));
  go(location.hash.slice(1) || 'dashboard');
})();
</script>
