# Proofly — local development database.
#
# Host port 5434 is deliberate: 5432 and 5433 are commonly already taken by
# another Postgres (a system install or another project's container). Nothing
# outside this file depends on the number — the app reads DATABASE_URL.
#
#   docker compose up -d          start
#   docker compose logs -f db     watch
#   docker compose down           stop (keeps data)
#   docker compose down -v        stop and wipe the data volume

services:
  db:
    image: postgres:16-alpine
    # Deliberately no container_name: a pinned one stops a second checkout of
    # this repo from starting at all ("the container name /proofly-db is
    # already in use"). Compose derives one from the directory instead, and
    # `docker compose exec db …` works either way.
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofly
      POSTGRES_PASSWORD: proofly
      POSTGRES_DB: proofly
      # Deterministic collation, so ORDER BY matches what the tests expect.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5434:5432"
    volumes:
      - proofly-db-data:/var/lib/postgresql/data
      # Runs once, on an empty data volume, to add the test database.
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      # CI and `docker compose up --wait` block until this passes, so migrations
      # never race the server's first start.
      test: ["CMD-SHELL", "pg_isready -U proofly -d proofly"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # A local inbox, not a delivery service. Mailpit accepts SMTP on 1025 and
  # shows every message at http://localhost:8025 — nothing leaves the machine,
  # which is the point: a bug in the reminder job must not be able to email a
  # real person. For real delivery, point SMTP_HOST/PORT/USER/PASS at any
  # provider; the application code does not change.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP, what the API talks to
      - "8025:8025" # web inbox, what you read
    environment:
      MP_MAX_MESSAGES: 500
      # Nothing is ever relayed onward, even if a real address is used.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  proofly-db-data:
