<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Purchase Tracker">
  <!-- The sidebar logo at favicon size: the same primary tile and grid mark.
       Filled squares rather than the stroked Lucide icon, because a 2px
       stroke turns to mud at 16px. -->
  <rect width="32" height="32" rx="7" fill="#1E40AF"/>
  <g fill="#FFFFFF">
    <rect x="6"  y="6"  width="9" height="9" rx="2"/>
    <rect x="17" y="6"  width="9" height="9" rx="2"/>
    <rect x="6"  y="17" width="9" height="9" rx="2"/>
    <rect x="17" y="17" width="9" height="9" rx="2"/>
  </g>
</svg>
